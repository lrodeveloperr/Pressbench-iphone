name: Run TestFlight Build

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD TESTFLIGHT to confirm upload
        required: true
        type: string
      build_number:
        description: Optional unused positive integer; blank uses GitHub run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pressbench-testflight
  cancel-in-progress: false

env:
  SOURCE_ZIP: PressBench-TestFlight-Source-v0.21.4.zip
  SOURCE_B64_GLOB: .source/PressBench-iOS-Approved-UI-v0.21.4.zip.b64.part-*
  IOS_BUNDLE_ID: com.goodusestudios.pressbench
  APPLE_TEAM_ID: 49SQ3XQ68Q
  MARKETING_VERSION: 0.21.4
  SCHEME: PressBench
  ARCHIVE_PATH: ${{ github.workspace }}/build/PressBench.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    name: Signed PressBench build to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out reviewed repository
        uses: actions/checkout@v4

      - name: Confirm manual upload
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "UPLOAD TESTFLIGHT" ]] || { echo 'Confirmation must exactly match UPLOAD TESTFLIGHT.' >&2; exit 1; }
          if [[ -n "$REQUESTED_BUILD" ]]; then
            [[ "$REQUESTED_BUILD" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Build number must be a positive integer.' >&2; exit 1; }
            BUILD_NUMBER="$REQUESTED_BUILD"
          else
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Bootstrap reviewed production source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/project.yml" && -f "$GITHUB_WORKSPACE/PressBench/Resources/PressBenchLogic.js" ]]; then
            source_root="$GITHUB_WORKSPACE"
          elif compgen -G "$GITHUB_WORKSPACE/$SOURCE_B64_GLOB" >/dev/null; then
            assembled="$RUNNER_TEMP/PressBench-iOS-Approved-UI-v0.21.4.zip"
            cat $GITHUB_WORKSPACE/$SOURCE_B64_GLOB | base64 --decode > "$assembled"
            echo '9923c610a3f68c33eeb44b0b605718bebe49413e8ac3513a21a1e5fcd315381d  '"$assembled" | shasum -a 256 -c -
            unpack="$RUNNER_TEMP/pressbench-source"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            ditto -x -k "$assembled" "$unpack"
            project="$(find "$unpack" -maxdepth 4 -type f -name project.yml -print -quit)"
            [[ -n "$project" ]] || { echo 'Approved source archive did not contain project.yml' >&2; exit 1; }
            source_root="$(dirname "$project")"
          elif [[ -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]]; then
            unpack="$RUNNER_TEMP/pressbench-source"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            ditto -x -k "$GITHUB_WORKSPACE/$SOURCE_ZIP" "$unpack"
            project="$(find "$unpack" -maxdepth 4 -type f -name project.yml -print -quit)"
            [[ -n "$project" ]] || { echo "$SOURCE_ZIP did not contain project.yml" >&2; exit 1; }
            source_root="$(dirname "$project")"
          else
            echo "Production source missing. Commit the unpacked source tree, approved Base64 source parts, or $SOURCE_ZIP." >&2
            exit 1
          fi
          [[ -f "$source_root/PressBench/Resources/PressBenchLogic.js" ]] || { echo 'PressBench deterministic engine missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/release_integrity.py" ]] || { echo 'Release integrity gate missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/verify_localization.py" ]] || { echo 'Localization gate missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/engine_smoke.js" ]] || { echo 'Engine smoke gate missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/app-store-connect-jwt.rb" ]] || { echo 'App Store Connect JWT helper missing.' >&2; exit 1; }
          echo "PB_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Release integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          python3 scripts/release_integrity.py

      - name: Localization integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          python3 scripts/verify_localization.py

      - name: Deterministic engine smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          node scripts/engine_smoke.js

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          rm -rf PressBench.xcodeproj
          xcodegen generate
          test -d PressBench.xcodeproj

      - name: Release simulator build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for runtime in d.values() for x in runtime if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(ids[0] if ids else "")')"
          [[ -n "$UDID" ]] || { echo 'No available iPhone simulator found.' >&2; exit 1; }
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Verify Apple credentials and app record
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          if (( ${#missing[@]} > 0 )); then
            echo "Missing repository Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'ASC_KEY_ID format is invalid.' >&2; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'ASC_ISSUER_ID format is invalid.' >&2; exit 1; }

          apple_key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$apple_key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$apple_key_dir"
          chmod 700 "$apple_key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          grep -Fq -- '-----BEGIN PRIVATE KEY-----' "$key_path"
          grep -Fq -- '-----END PRIVATE KEY-----' "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

          jwt="$(ruby "$PB_SOURCE_ROOT/scripts/app-store-connect-jwt.rb" "$key_path" "$ASC_KEY_ID" "$ASC_ISSUER_ID")"
          auth="Authorization: Bearer $jwt"
          bundle_json="$RUNNER_TEMP/bundle-id.json"
          app_json="$RUNNER_TEMP/app.json"

          curl --fail-with-body --silent --show-error --get \
            -H "$auth" \
            --data-urlencode "filter[identifier]=$IOS_BUNDLE_ID" \
            --data-urlencode 'limit=2' \
            'https://api.appstoreconnect.apple.com/v1/bundleIds' \
            -o "$bundle_json"
          ruby -rjson -e '
            data=JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "Expected exactly one registered bundle ID." unless data.length == 1
            actual=data.first.fetch("attributes").fetch("identifier")
            abort "Registered bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$bundle_json"

          curl --fail-with-body --silent --show-error --get \
            -H "$auth" \
            --data-urlencode "filter[bundleId]=$IOS_BUNDLE_ID" \
            --data-urlencode 'limit=2' \
            'https://api.appstoreconnect.apple.com/v1/apps' \
            -o "$app_json"
          ruby -rjson -e '
            data=JSON.parse(File.read(ARGV[0])).fetch("data")
            abort "PressBench App Store Connect app record is missing or ambiguous." unless data.length == 1
            actual=data.first.fetch("attributes").fetch("bundleId")
            abort "App Store Connect bundle ID mismatch: #{actual}" unless actual == ENV.fetch("IOS_BUNDLE_ID")
          ' "$app_json"

      - name: Archive App Store build for cloud signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          cd "$PB_SOURCE_ROOT"
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Verify archive identity
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo 'Archived .app not found.' >&2; exit 1; }
          plist="$app/Info.plist"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          [[ "$bundle" == "$IOS_BUNDLE_ID" ]] || { echo "Bundle ID mismatch: $bundle" >&2; exit 1; }
          [[ "$version" == "$MARKETING_VERSION" ]] || { echo "Marketing version mismatch: $version" >&2; exit 1; }
          [[ "$build" == "$BUILD_NUMBER" ]] || { echo "Build number mismatch: $build" >&2; exit 1; }
          [[ -f "$app/PrivacyInfo.xcprivacy" ]] || { echo 'PrivacyInfo.xcprivacy missing from signed app.' >&2; exit 1; }

      - name: Export signed IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$IPA_PATH" ]] || { echo 'IPA export failed.' >&2; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          verify_dir="$RUNNER_TEMP/ipa-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          ditto -x -k "$IPA_PATH" "$verify_dir"
          exported_app="$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$exported_app" ]] || { echo 'Exported app was not found in IPA.' >&2; exit 1; }
          exported_plist="$exported_app/Info.plist"
          exported_bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$exported_plist")"
          exported_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$exported_plist")"
          exported_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$exported_plist")"
          [[ "$exported_bundle" == "$IOS_BUNDLE_ID" ]] || { echo "Exported bundle ID mismatch: $exported_bundle" >&2; exit 1; }
          [[ "$exported_version" == "$MARKETING_VERSION" ]] || { echo "Exported version mismatch: $exported_version" >&2; exit 1; }
          [[ "$exported_build" == "$BUILD_NUMBER" ]] || { echo "Exported build mismatch: $exported_build" >&2; exit 1; }
          [[ -f "$exported_app/PrivacyInfo.xcprivacy" ]] || { echo 'PrivacyInfo.xcprivacy missing from exported app.' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$exported_app"
          profile="$exported_app/embedded.mobileprovision"
          [[ -f "$profile" ]] || { echo 'Embedded provisioning profile missing from exported app.' >&2; exit 1; }
          profile_plist="$RUNNER_TEMP/exported-profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo 'Exported profile unexpectedly contains registered devices.' >&2
            exit 1
          fi
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null || echo false)"
          [[ "$get_task_allow" == "false" ]] || { echo 'Exported profile permits debugging.' >&2; exit 1; }

      - name: Validate IPA with App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Retain exact TestFlight IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PressBench-TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7
