name: Export approved PressBench source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out iOS repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify approved source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approved-source"
          cat .source/PressBench-iOS-Approved-UI-v0.21.4.zip.b64.part-* | base64 --decode > "$RUNNER_TEMP/PressBench-iOS-Approved-UI-v0.21.4.zip"
          echo '9923c610a3f68c33eeb44b0b605718bebe49413e8ac3513a21a1e5fcd315381d  '"$RUNNER_TEMP/PressBench-iOS-Approved-UI-v0.21.4.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/PressBench-iOS-Approved-UI-v0.21.4.zip" -d "$RUNNER_TEMP/approved-source"
          test -f "$RUNNER_TEMP/approved-source/pressbench-ios-release/PressBench/Resources/PressBenchLogic.js"
          test -f "$RUNNER_TEMP/approved-source/pressbench-ios-release/PressBench/Resources/Localizations.json"
          find "$RUNNER_TEMP/approved-source" -type f -print | sort
      - name: Upload verified source package
        uses: actions/upload-artifact@v4
        with:
          name: pressbench-approved-ios-source-v0.21.4
          path: ${{ runner.temp }}/approved-source
          if-no-files-found: error
          retention-days: 2
