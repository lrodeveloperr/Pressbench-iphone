name: PressBench lifetime migration recovery v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lifetime-migration-recovery-v2.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize deterministic contract formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('PressBench/Resources/PressBenchLogic.js')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'''\s*ios:\s*Object\.freeze\(\{\s*productId:\s*"pressbench_unlimited_monthly_ios",\s*legacyProductIds:\s*Object\.freeze\(\["pressbench_unlimited_lifetime_ios"\]\),\s*productType:\s*"auto_renewable_subscription",\s*recurring:\s*true,\s*period:\s*"P1M",\s*restoreAction:\s*true,\s*benefits:\s*Object\.freeze\(\["unlimited_presses",\s*"pdf_xlsx_reports"\]\),\s*pricing:\s*Object\.freeze\(\{\s*baseStorefront:\s*"US",\s*baseCurrency:\s*"USD",\s*baseAmountMinor:\s*699,\s*geoPriced:\s*true\s*\}\)\s*\}\),''', re.S)
          expected = '''    ios: Object.freeze({
        productId: "pressbench_unlimited_monthly_ios",
        legacyProductIds: Object.freeze(["pressbench_unlimited_lifetime_ios"]),
        productType: "auto_renewable_subscription", recurring: true, period: "P1M", restoreAction: true,
        benefits: Object.freeze(["unlimited_presses", "pdf_xlsx_reports"]),
        pricing: Object.freeze({ baseStorefront: "US", baseCurrency: "USD", baseAmountMinor: 699, geoPriced: true })
      }),'''
          s2, n = pattern.subn('\n' + expected, s, count=1)
          if n != 1:
              raise SystemExit(f'Could not normalize iOS monetization block: {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Apply source migration
        run: python3 scripts/apply_lifetime_migration.py
      - name: Rebuild localization artifacts
        run: |
          python3 build_l10n.py
          python3 assemble_catalog.py
      - name: Re-pin deterministic engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          logic = Path('PressBench/Resources/PressBenchLogic.js')
          integrity = Path('scripts/release_integrity.py')
          digest = hashlib.sha256(logic.read_bytes()).hexdigest()
          text = integrity.read_text(encoding='utf-8')
          text, n = re.subn(r"require\(logic_hash == '[0-9a-f]{64}'", f"require(logic_hash == '{digest}'", text, count=1)
          if n != 1:
              raise SystemExit('Could not update deterministic logic hash')
          integrity.write_text(text, encoding='utf-8')
          print(digest)
          PY
      - name: Validate migrated contract
        run: |
          node scripts/engine_smoke.js
          python3 scripts/release_integrity.py
      - name: Commit validated migration
        run: |
          git config user.name "PressBench Release Migration"
          git config user.email "actions@users.noreply.github.com"
          git add PressBench scripts build_l10n.py localization_keys.json monetization_translations.json phrases.tsv UI-TEXT-INVENTORY.md LOCALIZATION-AUDIT-31-LANGUAGES.csv
          git diff --cached --check
          git commit -m "Finalize PressBench lifetime purchase migration"
          git push
