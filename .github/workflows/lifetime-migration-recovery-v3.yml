name: PressBench lifetime migration recovery v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lifetime-migration-recovery-v3.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed lifetime migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/lifetime-migration-once.yml')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r"\n          replace\('PressBench/Views/ReportsView\.swift'.*?\n\n          # Canonical English source strings\.", re.S)
          s2,n=pattern.subn('\n\n          # Canonical English source strings.',s,count=1)
          if n != 1: raise SystemExit(f'could not suppress brittle ReportsView replacement: {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          ruby - <<'RUBY'
          require 'yaml'
          doc = YAML.safe_load(File.read('.github/workflows/lifetime-migration-once.yml'), aliases: true)
          step = doc.fetch('jobs').fetch('migrate').fetch('steps').find { |x| x['name'] == 'Apply lifetime-purchase migration' }
          File.write('/tmp/apply-migration.sh', step.fetch('run'))
          RUBY
          bash -euo pipefail /tmp/apply-migration.sh
      - name: Patch lifetime UI and legacy entitlement compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re

          # StoreKit lifetime price must never be presented as monthly.
          p=Path('PressBench/Views/ReportsView.swift')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r'''if let price = store\.productDisplayPrice \{\s*Text\(PBL10n\.format\(\s*"upgrade\.pricePerMonthFormat",\s*language: language,\s*locale: locale,\s*price as NSString\s*\)\)\s*\}''',re.S)
          s,n=pattern.subn('''if let price = store.productDisplayPrice {
                                    Text(price)
                                }''',s,count=1)
          if n != 1: raise SystemExit(f'ReportsView replacements={n}')
          p.write_text(s,encoding='utf-8')

          # New primary product is non-consumable; only the retired monthly ID is subscription-shaped.
          p=Path('PressBench/Resources/PressBenchLogic.js')
          s=p.read_text(encoding='utf-8')
          old='''    const productType = platform === "ios" && productId === B.MONETIZATION_MODEL.ios.productId ?
      "auto_renewable_subscription" : "non_consumable";'''
          new='''    const productType = platform === "ios" ?
      (productId === B.MONETIZATION_MODEL.ios.productId ? "non_consumable" :
       B.MONETIZATION_MODEL.ios.legacyProductIds.includes(productId) ? "auto_renewable_subscription" : "non_consumable") :
      "non_consumable";'''
          if s.count(old)!=1: raise SystemExit(f'productType contract matches={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          # Re-pin deterministic logic after the compatibility fix.
          p=Path('scripts/release_integrity.py')
          s=p.read_text(encoding='utf-8')
          h=hashlib.sha256(Path('PressBench/Resources/PressBenchLogic.js').read_bytes()).hexdigest()
          s,n=re.subn(r"require\(logic_hash == '[0-9a-f]{64}'",f"require(logic_hash == '{h}'",s,count=1)
          if n!=1: raise SystemExit('logic hash pin not found')
          p.write_text(s,encoding='utf-8')
          print('pinned logic',h)
          PY
      - name: Validate migrated release contract
        run: |
          set -euo pipefail
          node scripts/engine_smoke.js
          python3 scripts/release_integrity.py
      - name: Commit validated migration
        run: |
          set -euo pipefail
          git config user.name "PressBench Release Migration"
          git config user.email "actions@users.noreply.github.com"
          git add PressBench scripts build_l10n.py localization_keys.json monetization_translations.json phrases.tsv UI-TEXT-INVENTORY.md LOCALIZATION-AUDIT-31-LANGUAGES.csv
          git diff --cached --check
          git commit -m "Finalize PressBench lifetime purchase migration"
          git push
