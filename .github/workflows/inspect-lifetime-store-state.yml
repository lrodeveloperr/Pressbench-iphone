name: Inspect PressBench lifetime store state

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-lifetime-store-state.yml"

permissions:
  contents: read

env:
  BUNDLE_ID: com.goodusestudios.pressbench
  ASC_DEFAULT_OUTPUT: json
  ASC_TELEMETRY_DISABLED: "1"
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rudrankriyam/setup-asc@v1
        with:
          version: latest
      - name: Inspect current app, version and purchases
        run: |
          set -euo pipefail
          APP_JSON="$(asc apps list --bundle-id "$BUNDLE_ID" --limit 2 --output json)"
          APP_ID="$(jq -r '.data[] | select(.attributes.bundleId == env.BUNDLE_ID) | .id' <<<"$APP_JSON")"
          test -n "$APP_ID"
          echo "APP_ID=$APP_ID"
          echo '--- app versions ---'
          asc versions list --app "$APP_ID" --platform IOS --output json || true
          echo '--- non-consumable IAPs ---'
          asc iap list --app-id "$APP_ID" --output json || true
          echo '--- subscription groups ---'
          asc subscriptions groups list --app "$APP_ID" --paginate --output json || true
