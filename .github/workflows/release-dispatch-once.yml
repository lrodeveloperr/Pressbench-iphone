name: One-shot PressBench iOS release dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-dispatch-once.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: pressbench-one-shot-release-dispatch
  cancel-in-progress: false

jobs:
  release:
    name: iPhone SE gate then TestFlight
    if: github.repository == 'lrodeveloperr/Pressbench-iphone'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out dispatch commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dispatch iPhone SE gate and require success
        id: se_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          expected_sha="$GITHUB_SHA"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh api --method POST "/repos/$repo/actions/workflows/validate-ios.yml/dispatches" \
            -f ref=main

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api "/repos/$repo/actions/workflows/validate-ios.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"$expected_sha\" and .created_at >= \"$dispatched_at\") | .id" | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'Could not locate the dispatched iPhone SE validation run.' >&2; exit 1; }
          echo "se_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "iPhone SE gate run: $run_id"

          for _ in $(seq 1 180); do
            status="$(gh api "/repos/$repo/actions/runs/$run_id" --jq .status)"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(gh api "/repos/$repo/actions/runs/$run_id" --jq .conclusion)"
              echo "iPhone SE gate conclusion: $conclusion"
              [[ "$conclusion" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for the iPhone SE gate.' >&2
          exit 1

      - name: Dispatch TestFlight upload
        id: testflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          expected_sha="$GITHUB_SHA"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          payload="$(jq -n '{ref:"main",inputs:{confirmation:"UPLOAD TESTFLIGHT",build_number:""}}')"
          gh api --method POST "/repos/$repo/actions/workflows/testflight.yml/dispatches" \
            --input - <<< "$payload"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api "/repos/$repo/actions/workflows/testflight.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"$expected_sha\" and .created_at >= \"$dispatched_at\") | .id" | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'Could not locate the dispatched TestFlight run.' >&2; exit 1; }
          echo "testflight_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "TestFlight run: $run_id"

          for _ in $(seq 1 360); do
            status="$(gh api "/repos/$repo/actions/runs/$run_id" --jq .status)"
            if [[ "$status" == "completed" ]]; then
              conclusion="$(gh api "/repos/$repo/actions/runs/$run_id" --jq .conclusion)"
              echo "TestFlight conclusion: $conclusion"
              [[ "$conclusion" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for TestFlight.' >&2
          exit 1

      - name: Remove one-shot dispatcher
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/release-dispatch-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove one-shot release dispatcher'
          git push origin HEAD:main
