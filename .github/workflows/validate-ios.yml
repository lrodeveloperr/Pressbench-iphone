name: Validate PressBench iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pressbench-ios-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: PressBench-TestFlight-Source-v0.21.4.zip
  SOURCE_B64_GLOB: .source/PressBench-iOS-Approved-UI-v0.21.4.zip.b64.part-*
  SCHEME: PressBench

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.6.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew untap aws/tap >/dev/null 2>&1 || true
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Bootstrap reviewed production source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$GITHUB_WORKSPACE/project.yml" && -f "$GITHUB_WORKSPACE/PressBench/Resources/PressBenchLogic.js" ]]; then
            source_root="$GITHUB_WORKSPACE"
          elif compgen -G "$GITHUB_WORKSPACE/$SOURCE_B64_GLOB" >/dev/null; then
            assembled="$RUNNER_TEMP/PressBench-iOS-Approved-UI-v0.21.4.zip"
            cat $GITHUB_WORKSPACE/$SOURCE_B64_GLOB | base64 --decode > "$assembled"
            echo '9923c610a3f68c33eeb44b0b605718bebe49413e8ac3513a21a1e5fcd315381d  '"$assembled" | shasum -a 256 -c -
            unpack="$RUNNER_TEMP/pressbench-source"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            ditto -x -k "$assembled" "$unpack"
            project="$(find "$unpack" -maxdepth 4 -type f -name project.yml -print -quit)"
            [[ -n "$project" ]] || { echo 'Approved source archive did not contain project.yml' >&2; exit 1; }
            source_root="$(dirname "$project")"
          elif [[ -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]]; then
            unpack="$RUNNER_TEMP/pressbench-source"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            ditto -x -k "$GITHUB_WORKSPACE/$SOURCE_ZIP" "$unpack"
            project="$(find "$unpack" -maxdepth 4 -type f -name project.yml -print -quit)"
            [[ -n "$project" ]] || { echo "$SOURCE_ZIP did not contain project.yml" >&2; exit 1; }
            source_root="$(dirname "$project")"
          else
            echo "Production source missing. Commit the unpacked source tree, approved Base64 source parts, or $SOURCE_ZIP." >&2
            exit 1
          fi
          [[ -f "$source_root/PressBench/Resources/PressBenchLogic.js" ]] || { echo 'PressBench deterministic engine missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/release_integrity.py" ]] || { echo 'Release integrity gate missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/verify_localization.py" ]] || { echo 'Localization gate missing.' >&2; exit 1; }
          [[ -f "$source_root/scripts/engine_smoke.js" ]] || { echo 'Engine smoke gate missing.' >&2; exit 1; }
          echo "PB_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"

      - name: Release integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          python3 scripts/release_integrity.py

      - name: Localization integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          python3 scripts/verify_localization.py

      - name: Deterministic engine smoke tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          node scripts/engine_smoke.js

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          rm -rf PressBench.xcodeproj
          xcodegen generate
          test -d PressBench.xcodeproj

      - name: Release simulator build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create iPhone SE and Face ID audit simulators
        shell: bash
        run: |
          set -euo pipefail
          simulator_tuple="$(python3 - <<'PY'
          import json, subprocess

          runtimes = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "available", "-j"], text=True
          ))["runtimes"]
          ios = [item for item in runtimes if item.get("isAvailable") and item.get("name", "").startswith("iOS")]
          runtime = sorted(ios, key=lambda item: tuple(int(part) for part in item["version"].split(".")))[-1]

          types = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devicetypes", "-j"], text=True
          ))["devicetypes"]
          by_name = {item["name"]: item["identifier"] for item in types}
          se = by_name.get("iPhone SE (3rd generation)")
          face = next((by_name.get(name) for name in (
              "iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro", "iPhone 14 Pro"
          ) if by_name.get(name)), None)
          if not se or not face:
              raise SystemExit("Required iPhone SE and Face ID simulator device types are unavailable")
          print("\t".join((runtime["identifier"], se, face)))
          PY
          )"
          IFS=$'\t' read -r runtime_id se_type face_type <<< "$simulator_tuple"
          se_udid="$(xcrun simctl create 'PressBench iPhone SE Audit' "$se_type" "$runtime_id")"
          face_udid="$(xcrun simctl create 'PressBench Face ID Audit' "$face_type" "$runtime_id")"
          echo "PB_SE_UDID=$se_udid" >> "$GITHUB_ENV"
          echo "PB_FACE_UDID=$face_udid" >> "$GITHUB_ENV"

      - name: Dedicated UI test — iPhone SE
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          result_bundle="$GITHUB_WORKSPACE/build/PressBenchSETests.xcresult"
          rm -rf "$result_bundle"
          mkdir -p "$(dirname "$result_bundle")"
          xcrun simctl boot "$PB_SE_UDID"
          xcrun simctl bootstatus "$PB_SE_UDID" -b
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PB_SE_UDID" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PressBenchUITests \
            test

      - name: Unit tests — Face ID iPhone
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          xcrun simctl boot "$PB_FACE_UDID"
          xcrun simctl bootstatus "$PB_FACE_UDID" -b
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PB_FACE_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PressBenchTests \
            test

      - name: UI tests — Face ID iPhone
        shell: bash
        run: |
          set -euo pipefail
          cd "$PB_SOURCE_ROOT"
          result_bundle="$GITHUB_WORKSPACE/build/PressBenchFaceIDTests.xcresult"
          rm -rf "$result_bundle"
          xcodebuild \
            -project PressBench.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$PB_FACE_UDID" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:PressBenchUITests \
            test

      - name: Export UI audit screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          screenshot_dir="$GITHUB_WORKSPACE/build/ui-screenshots"
          rm -rf "$screenshot_dir"
          mkdir -p "$screenshot_dir"
          devices=(SE FaceID)
          for device in "${devices[@]}"; do
            result_bundle="$GITHUB_WORKSPACE/build/PressBench${device}Tests.xcresult"
            output_dir="$screenshot_dir/$device"
            [[ -d "$result_bundle" ]] || { echo "$device Xcode test result bundle is missing." >&2; exit 1; }
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$output_dir"
          done

      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pressbench-ui-audit-screenshots
          path: build/ui-screenshots/**/*.png
          if-no-files-found: error
          retention-days: 14
