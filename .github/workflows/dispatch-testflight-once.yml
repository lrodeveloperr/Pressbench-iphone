name: Dispatch TestFlight Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-testflight-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TestFlight upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GH_REPO}/actions/workflows/testflight.yml/dispatches" \
            -f ref=main \
            -f 'inputs[confirmation]=UPLOAD TESTFLIGHT'
