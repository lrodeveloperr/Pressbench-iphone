name: Upload PressBench App Store Screenshots

on:
  pull_request:
    paths:
      - .app-store/screenshots/**
      - .github/workflows/upload-app-store-listing.yml

permissions:
  contents: read

jobs:
  upload:
    if: github.event.pull_request.head.ref == 'capture-finalization'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out screenshot payload
        uses: actions/checkout@v4

      - name: Decode and verify screenshots
        shell: bash
        run: |
          set -euo pipefail
          screenshot_dir="$RUNNER_TEMP/screenshots/en-CA"
          mkdir -p "$screenshot_dir"
          for source in .app-store/screenshots/en-CA/*.jpg.b64; do
            output="$screenshot_dir/$(basename "$source" .b64)"
            base64 -D -i "$source" -o "$output"
            dimensions="$(sips -g pixelWidth -g pixelHeight "$output")"
            grep -Fq 'pixelWidth: 1320' <<< "$dimensions"
            grep -Fq 'pixelHeight: 2868' <<< "$dimensions"
          done
          [[ "$(find "$screenshot_dir" -type f -name '*.jpg' | wc -l | tr -d ' ')" == 3 ]]
          echo "PB_SCREENSHOT_DIR=$RUNNER_TEMP/screenshots" >> "$GITHUB_ENV"

      - name: Configure App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]]
          key_json="$RUNNER_TEMP/app-store-connect-api-key.json"
          ruby -rjson -e '
            File.write(
              ARGV.fetch(0),
              JSON.generate({
                key_id: ENV.fetch("ASC_KEY_ID"),
                issuer_id: ENV.fetch("ASC_ISSUER_ID"),
                key: ENV.fetch("ASC_PRIVATE_KEY"),
                in_house: false
              })
            )
          ' "$key_json"
          chmod 600 "$key_json"
          echo "PB_ASC_KEY_JSON=$key_json" >> "$GITHUB_ENV"

      - name: Install Fastlane
        shell: bash
        run: |
          set -euo pipefail
          command -v fastlane >/dev/null || gem install fastlane --no-document
          fastlane --version

      - name: Upload three screenshots without submitting
        shell: bash
        run: |
          set -euo pipefail
          fastlane deliver \
            --api_key_path "$PB_ASC_KEY_JSON" \
            --app_identifier com.goodusestudios.pressbench \
            --platform ios \
            --app_version 1.0 \
            --screenshots_path "$PB_SCREENSHOT_DIR" \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_app_version_update true \
            --overwrite_screenshots true \
            --run_precheck_before_submit false \
            --submit_for_review false \
            --force true
