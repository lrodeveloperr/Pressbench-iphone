name: Kitchen TestFlight Build v4

on:
  push:
    branches: [kitchen-testflight-builder]
    paths:
      - .github/workflows/kitchen-testflight-build-v4.yml

permissions:
  contents: read

concurrency:
  group: kitchen-testflight-v4
  cancel-in-progress: true

env:
  IOS_BUNDLE_ID: studio.gooduse.kitchenprep
  APPLE_TEAM_ID: 49SQ3XQ68Q
  MARKETING_VERSION: 2.0.0
  BUILD_NUMBER: 202

jobs:
  build-sign-upload:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out signing harness
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Fetch shared Kitchen Flutter codebase
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vgc-release-candidate \
            https://github.com/lrodeveloperr/kitcgen-prep-android.git \
            "$RUNNER_TEMP/kitchen-src"
          echo "KITCHEN_ROOT=$RUNNER_TEMP/kitchen-src/flutter_app" >> "$GITHUB_ENV"

      - name: Align generated iOS production flavor with shared entrypoint
        shell: bash
        run: |
          set -euo pipefail
          cd "$KITCHEN_ROOT"
          pbx='ios/Runner.xcodeproj/project.pbxproj'
          test -f "$pbx"
          sed -i '' 's#FLUTTER_TARGET = lib/main_production.dart;#FLUTTER_TARGET = lib/main.dart;#g' "$pbx"
          if grep -q 'FLUTTER_TARGET = lib/main_production.dart;' "$pbx"; then
            echo 'Stale production entrypoint remains.' >&2
            exit 1
          fi
          grep -q 'FLUTTER_TARGET = lib/main.dart;' "$pbx"

      - name: Build iOS AppIcon catalog from shared production icon
        shell: bash
        run: |
          set -euo pipefail
          src="$KITCHEN_ROOT/android/app/src/main/ic_launcher-playstore.png"
          out="$KITCHEN_ROOT/ios/Runner/Assets.xcassets/AppIcon.appiconset"
          test -s "$src"
          rm -rf "$out"
          mkdir -p "$out"
          resize() { sips -z "$1" "$1" "$src" --out "$out/$2" >/dev/null; }
          resize 20 Icon-App-20x20@1x.png
          resize 40 Icon-App-20x20@2x.png
          resize 60 Icon-App-20x20@3x.png
          resize 29 Icon-App-29x29@1x.png
          resize 58 Icon-App-29x29@2x.png
          resize 87 Icon-App-29x29@3x.png
          resize 40 Icon-App-40x40@1x.png
          resize 80 Icon-App-40x40@2x.png
          resize 120 Icon-App-40x40@3x.png
          resize 120 Icon-App-60x60@2x.png
          resize 180 Icon-App-60x60@3x.png
          resize 76 Icon-App-76x76@1x.png
          resize 152 Icon-App-76x76@2x.png
          resize 167 Icon-App-83.5x83.5@2x.png
          resize 1024 Icon-App-1024x1024@1x.png
          cat > "$out/Contents.json" <<'JSON'
          {
            "images": [
              {"idiom":"iphone","size":"20x20","scale":"2x","filename":"Icon-App-20x20@2x.png"},
              {"idiom":"iphone","size":"20x20","scale":"3x","filename":"Icon-App-20x20@3x.png"},
              {"idiom":"iphone","size":"29x29","scale":"2x","filename":"Icon-App-29x29@2x.png"},
              {"idiom":"iphone","size":"29x29","scale":"3x","filename":"Icon-App-29x29@3x.png"},
              {"idiom":"iphone","size":"40x40","scale":"2x","filename":"Icon-App-40x40@2x.png"},
              {"idiom":"iphone","size":"40x40","scale":"3x","filename":"Icon-App-40x40@3x.png"},
              {"idiom":"iphone","size":"60x60","scale":"2x","filename":"Icon-App-60x60@2x.png"},
              {"idiom":"iphone","size":"60x60","scale":"3x","filename":"Icon-App-60x60@3x.png"},
              {"idiom":"ipad","size":"20x20","scale":"1x","filename":"Icon-App-20x20@1x.png"},
              {"idiom":"ipad","size":"20x20","scale":"2x","filename":"Icon-App-20x20@2x.png"},
              {"idiom":"ipad","size":"29x29","scale":"1x","filename":"Icon-App-29x29@1x.png"},
              {"idiom":"ipad","size":"29x29","scale":"2x","filename":"Icon-App-29x29@2x.png"},
              {"idiom":"ipad","size":"40x40","scale":"1x","filename":"Icon-App-40x40@1x.png"},
              {"idiom":"ipad","size":"40x40","scale":"2x","filename":"Icon-App-40x40@2x.png"},
              {"idiom":"ipad","size":"76x76","scale":"1x","filename":"Icon-App-76x76@1x.png"},
              {"idiom":"ipad","size":"76x76","scale":"2x","filename":"Icon-App-76x76@2x.png"},
              {"idiom":"ipad","size":"83.5x83.5","scale":"2x","filename":"Icon-App-83.5x83.5@2x.png"},
              {"idiom":"ios-marketing","size":"1024x1024","scale":"1x","filename":"Icon-App-1024x1024@1x.png"}
            ],
            "info": {"version":1,"author":"xcode"}
          }
          JSON
          test -s "$out/Contents.json"

      - name: Resolve packages
        working-directory: ${{ env.KITCHEN_ROOT }}
        run: flutter pub get

      - name: Analyze shared code
        working-directory: ${{ env.KITCHEN_ROOT }}
        run: flutter analyze --no-fatal-infos

      - name: Test shared code
        working-directory: ${{ env.KITCHEN_ROOT }}
        run: flutter test

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY" ]]
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Compile shared Flutter code for iOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$KITCHEN_ROOT"
          flutter build ios --release --flavor production -t lib/main.dart --no-codesign \
            --build-name "$MARKETING_VERSION" --build-number "$BUILD_NUMBER"

      - name: Archive unsigned app for cloud signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/KitchenPrepBoard.xcarchive"
          export_dir="$RUNNER_TEMP/KitchenExport"
          rm -rf "$archive" "$export_dir"
          mkdir -p "$export_dir"
          cd "$KITCHEN_ROOT/ios"
          xcodebuild -workspace Runner.xcworkspace -scheme production -configuration Release-production \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            FLUTTER_TARGET=lib/main.dart \
            FLUTTER_BUILD_NAME="$MARKETING_VERSION" FLUTTER_BUILD_NUMBER="$BUILD_NUMBER" \
            clean archive
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$export_dir" >> "$GITHUB_ENV"

      - name: Stage embedded frameworks
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]]
          plist="$app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == "$IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$MARKETING_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$BUILD_NUMBER" ]]
          while IFS= read -r -d '' framework; do
            codesign --force --sign - --timestamp=none "$framework"
          done < <(find "$app/Frameworks" -depth -type d -name '*.framework' -print0 2>/dev/null || true)

      - name: Export Apple Distribution IPA
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$options" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]]
          cp "$ipa" "$RUNNER_TEMP/Kitchen-Prep-Board-TestFlight.ipa"
          shasum -a 256 "$RUNNER_TEMP/Kitchen-Prep-Board-TestFlight.ipa" > "$RUNNER_TEMP/Kitchen-Prep-Board-TestFlight.ipa.sha256"

      - name: Validate and upload to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          ipa="$RUNNER_TEMP/Kitchen-Prep-Board-TestFlight.ipa"
          xcrun altool --validate-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/apple-validation.log"
          validate_rc=${PIPESTATUS[0]}
          upload_rc=99
          if [[ $validate_rc -eq 0 ]]; then
            xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/apple-upload.log"
            upload_rc=${PIPESTATUS[0]}
          else
            echo 'Upload skipped because Apple validation failed.' | tee "$RUNNER_TEMP/apple-upload.log"
          fi
          if [[ $upload_rc -eq 0 ]]; then
            echo 'TESTFLIGHT_UPLOAD=SUCCESS' | tee "$RUNNER_TEMP/TestFlight-status.txt"
          else
            echo "TESTFLIGHT_UPLOAD=BLOCKED validate_rc=$validate_rc upload_rc=$upload_rc" | tee "$RUNNER_TEMP/TestFlight-status.txt"
          fi
          exit 0

      - name: Retain exact IPA and Apple logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kitchen-Prep-Board-TestFlight-202
          path: |
            ${{ runner.temp }}/Kitchen-Prep-Board-TestFlight.ipa
            ${{ runner.temp }}/Kitchen-Prep-Board-TestFlight.ipa.sha256
            ${{ runner.temp }}/TestFlight-status.txt
            ${{ runner.temp }}/apple-validation.log
            ${{ runner.temp }}/apple-upload.log
          if-no-files-found: warn
          retention-days: 14
