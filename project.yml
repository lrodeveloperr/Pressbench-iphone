name: PressBench
options:
  bundleIdPrefix: com.goodusestudios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.goodusestudios.pressbench
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.22.0
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PressBench
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: 49SQ3XQ68Q
    CODE_SIGN_STYLE: Automatic
targets:
  PressBench:
    type: application
    platform: iOS
    sources:
      - path: PressBench
        excludes:
          - Resources
      - path: PressBench/Resources
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: PressBench/PressBench.entitlements
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O

  PressBenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PressBenchTests
    dependencies:
      - target: PressBench
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 49SQ3XQ68Q

schemes:
  PressBench:
    build:
      targets:
        PressBench: all
    test:
      targets:
        - PressBenchTests
